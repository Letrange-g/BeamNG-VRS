; Restart BeamNG after editing. Use a dot for decimal values.
; Size1x1 is the full-quality region; Size2x2 is the medium-quality outer boundary.
; Sizes range from 0 to 1. Size2x2 must be at least Size1x1.
[Foveation]
; Set false for scissor-only or turbo-only use.
Enabled=true
Size1x1=0.25
Size2x2=0.60
; Available shapes: circle, square, ellipse.
; circle: diameter relative to eye-image height (0.25 = 25% of height).
; square: side length relative to eye-image height.
; ellipse: horizontal diameter relative to eye-image width,
;          vertical diameter relative to eye-image height.
Shape=ellipse

[Debug]
DrawOutline=false

[Scissor]
Enabled=false
; Top/Bottom: fraction of eye-image height. Range for each edge: 0 to 0.49.
Top=0.30
Bottom=0.30
; Horizontal edges: fraction of that eye's image width (0.05 = 5%).
; Range for each edge: 0 to 0.49. All four default to zero.
; Left/right refer to the image as seen by that eye; they are not mirrored.
; Start small and check each eye in the headset. Restart after changes.
; LEFT EYE: left = outer edge, right = near the nose.
LeftEyeLeft=0
LeftEyeRight=0
; RIGHT EYE: left = near the nose, right = outer edge.
RightEyeLeft=0
RightEyeRight=0

[Tracking]
GracePeriodMs=30
GazeRefreshMs=8

[Performance]
; Experimental: overlaps CPU work with the OpenXR runtime wait.
; May interfere with motion reprojection. Compare smoothness as well as FPS.
; Set false to restore normal timing. Restart after changing this option.
TurboMode=false

[Logging]
; off = no layer logs, errors = problems only, info = brief status (default),
; debug = detailed troubleshooting. Restart after changing this option.
Level=info
