; Restart BeamNG after editing. Use a dot for decimal values.
; Size1x1 is the full-quality region; Size2x2 is the medium-quality outer boundary.
; Sizes range from 0 to 1. Size2x2 must be at least Size1x1.
[Foveation]
; Set false for scissor-only or turbo-only use.
Enabled=true
; true: also foveate the game's internal eye-sized passes (scene, lighting,
; post effects), not only the final image. Set false to compare.
AllPasses=true
Size1x1=0.25
Size2x2=0.55
; Available shapes: circle, square, ellipse.
; circle: diameter relative to eye-image height (0.25 = 25% of height).
; square: side length relative to eye-image height.
; ellipse: horizontal diameter relative to eye-image width,
;          vertical diameter relative to eye-image height.
Shape=circle

[Debug]
DrawOutline=false

[Scissor]
; Vulkan: skips drawing the cropped edges. Direct3D 12: removes them from the
; field of view, so BeamNG renders a smaller image in every pass.
Enabled=true
; Top/Bottom: fraction of eye-image height. Range for each edge: 0 to 0.49.
Top=0.30
Bottom=0.30
; Horizontal edges: fraction of that eye's image width (0.05 = 5%).
; Range for each edge: 0 to 0.49. Outer edges default to 0.10; nose edges to 0.
; Left/right refer to the image as seen by that eye; they are not mirrored.
; Start small and check each eye in the headset. Restart after changes.
; LEFT EYE: left = outer edge, right = near the nose.
LeftEyeLeft=0.10
LeftEyeRight=0
; RIGHT EYE: left = near the nose, right = outer edge.
RightEyeLeft=0
RightEyeRight=0.10

[LensMask]
; Skips rendering the image corners hidden by the headset lenses.
; Size is the kept ellipse relative to the eye image: 1.0 touches all four
; edges (about 21% of pixels skipped); 1.41 or more skips nothing. Range 0.5 to 1.5.
; If you see black corners or edges in the headset, increase Size.
Enabled=true
Size=1.15

[Tracking]
GracePeriodMs=30
GazeRefreshMs=8

[Performance]
; Experimental: overlaps CPU work with the OpenXR runtime wait.
; May interfere with motion reprojection. Compare smoothness as well as FPS.
; Set true to try it. Restart after changing this option.
TurboMode=false

[OpenXR]
; Other programs' OpenXR layers (overlays, toolkits, streaming add-ons) load
; into every VR game and can stop BeamNG from switching to VR. List their names
; here, separated by commas, to turn them off for BeamNG only; other games
; keep them. Diagnose-BeamNG-VRS.cmd prints the installed names.
; * turns off all of them (default). Empty keeps every layer; list names to
; turn off only those, for example if you need one layer such as a toolkit.
DisableLayers=*

[Renderer]
; d3d12 = BeamNG's Direct3D 12 renderer, the game's VR default since 0.40 (default).
; Foveation (with eye tracking), scissor, lens mask, outline, turbo and logging
; work there; foveation needs a GPU with D3D12 VRS Tier 2.
; vulkan = BeamNG's Vulkan renderer with VRS, scissor and lens mask (no new features).
API=d3d12
; Direct3D 12 only: VR render scale before FSR upscaling, 0.25-1.0. BeamNG 0.40
; uses 0.5 in VR; 1.0 is much sharper but costs about 4x the pixel work. The
; launcher applies it with a small mod in your BeamNG user folder, which
; also puts it back if the game lowers it
; (mods\unpacked\beamng_vrs) and removes that mod when this line is commented out.
; RenderScale=0.67
; Experimental, Direct3D 12 and Vulkan: VR draw distance in metres, 100-10000.
; BeamNG 0.40 draws VR up to 10000 m whatever the level's visible distance;
; a lower value can save GPU time in open maps. The layer finds that distance in
; the game's code at every start. Comment the line out if the game misbehaves.
; VRDrawDistance=800

[Logging]
; off = no layer logs, errors = problems only, info = brief status (default),
; debug = detailed troubleshooting. Restart after changing this option.
Level=info
