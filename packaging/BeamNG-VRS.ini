; Restart BeamNG after editing. Use a dot for decimal values.
; Size1x1 is the full-quality region; Size2x2 is the medium-quality outer boundary.
; Sizes range from 0 to 1. Size2x2 must be at least Size1x1.
[Foveation]
Size1x1=0.25
Size2x2=0.60
; Available shapes: circle, square, ellipse.
; circle: diameter relative to eye-image height (0.25 = 25% of height).
; square: side length relative to eye-image height.
; ellipse: horizontal diameter relative to eye-image width,
;          vertical diameter relative to eye-image height.
Shape=ellipse

[Debug]
DrawOutline=false

[Scissor]
Enabled=false
; Top/Bottom: fraction of eye-image height. Range for each edge: 0 to 0.49.
Top=0.30
Bottom=0.30
; Left/Right: fraction of eye-image width (0.05 = 5% from that edge).
; Start small and check both eyes in the headset for visible black borders.
Left=0
Right=0

[Tracking]
GracePeriodMs=30
GazeRefreshMs=8
