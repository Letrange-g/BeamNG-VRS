; Restart BeamNG after editing. Use a dot for decimal values.
; Size1x1 is the full-quality region; Size2x2 is the medium-quality outer boundary.
; Sizes range from 0 to 1. Size2x2 must be at least Size1x1.
[Foveation]
; Set false for scissor-only or turbo-only use.
Enabled=true
Size1x1=0.25
Size2x2=0.60
; Available shapes: circle, square, ellipse.
; circle: diameter relative to eye-image height (0.25 = 25% of height).
; square: side length relative to eye-image height.
; ellipse: horizontal diameter relative to eye-image width,
;          vertical diameter relative to eye-image height.
Shape=circle

[Debug]
DrawOutline=false

[Scissor]
Enabled=false
; Top/Bottom: fraction of eye-image height. Range for each edge: 0 to 0.49.
Top=0.30
Bottom=0.30
; Horizontal edges: fraction of that eye's image width (0.05 = 5%).
; Range for each edge: 0 to 0.49. Outer edges default to 0.10; nose edges to 0.
; Left/right refer to the image as seen by that eye; they are not mirrored.
; Start small and check each eye in the headset. Restart after changes.
; LEFT EYE: left = outer edge, right = near the nose.
LeftEyeLeft=0.10
LeftEyeRight=0
; RIGHT EYE: left = near the nose, right = outer edge.
RightEyeLeft=0
RightEyeRight=0.10

[Tracking]
GracePeriodMs=30
GazeRefreshMs=8

[Performance]
; Experimental: overlaps CPU work with the OpenXR runtime wait.
; May interfere with motion reprojection. Compare smoothness as well as FPS.
; Set false to restore normal timing. Restart after changing this option.
TurboMode=true

[Logging]
; off = no layer logs, errors = problems only, info = brief status (default),
; debug = detailed troubleshooting. Restart after changing this option.
Level=info

[Experimental]
; Test build: fixed, centered VRS on learned earlier scene targets shared by both
; eyes. Final-eye VRS still follows gaze. Leave false unless comparing this test.
; Requires [Foveation] Enabled=true and EarlyPasses=false. Restart after changing.
; Allow 10 seconds to learn, then compare GPU time and check both eyes.
SharedSceneVRS=false
; Performance-ceiling test: uniform 4x4 shading on selected earlier UNORM
; pipelines. The center can look coarse too; region sizes do not affect this test.
; Can run without SharedSceneVRS. Final-eye VRS still follows gaze.
; Requires [Foveation] Enabled=true and EarlyPasses=false. Restart to apply.
UnormSceneVRS=false
; Diagnostic only: alternate UNORM VRS off/on every 10 seconds and record timings.
; Requires UnormSceneVRS=true. Keep ProfileGPU=false; this enables its own timing.
; Leave false for normal play or manual off/on comparisons. See UNORM test guide.
CompareUnormVRS=false
; false = existing VRS scope, without the extra tracking.
; true = also apply VRS to repeatedly observed, unambiguous earlier colour targets.
; Restart after changing. Allow a few seconds to learn; compare GPU time and
; check both eyes for flicker/incorrect shading. Look for M8.33 EARLY_VRS in log.
; This is experimental inference from bound textures, not shader analysis.
EarlyPasses=false
; Diagnostic only: sample GPU timings and image connections. Leave false for play.
; For performance comparisons, keep ProfileGPU=false. Restart to apply.
ProfileGPU=false
