name: Build Windows release ZIP
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example 0.1.0)
        required: true
        default: 0.1.1-profile.3
      publish_release:
        description: Create a GitHub release from the tested ZIP
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: true
      draft_release:
        description: Prepare a draft for package verification before publication
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build DLLs, run tests, and package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.1.1-profile.3' }}
        run: ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION
      - name: Measure CPU pattern construction
        shell: pwsh
        run: |
          & ./build/windows-release/Release/pattern_benchmark.exe | Tee-Object -FilePath out/pattern-benchmark-windows.csv
          if ($LASTEXITCODE -ne 0) { throw 'Pattern benchmark validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: CPU-pattern-benchmark
          path: out/pattern-benchmark-windows.csv
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-VRS-windows-x64
          path: |
            out/releases/*.zip
            out/releases/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BeamNG-VRS-windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: CPU-pattern-benchmark
          path: release-assets
      - name: Verify archive checksum
        working-directory: release-assets
        run: sha256sum --check *.sha256
      - name: Create tested release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_DRAFT: ${{ inputs.draft_release }}
        run: |
          release_args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            --title "BeamNG-VRS ${PACKAGE_VERSION} — portable Windows x64"
            --notes-file packaging/RELEASE-NOTES.md)
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest=false)
          fi
          if [[ "$RELEASE_DRAFT" == 'true' ]]; then release_args+=(--draft); fi
          gh release create "v${PACKAGE_VERSION}" \
            release-assets/*.zip release-assets/*.sha256 release-assets/*.csv \
            "${release_args[@]}"
